<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GoldTrac — Verify</title>
  <link rel="stylesheet" href="./tokens.css" />
  <link rel="stylesheet" href="./components.css" />
  <style>
    .wrap{max-width:760px;margin:0 auto;padding:28px 26px 72px}
    textarea{width:100%;min-height:220px;padding:14px;background:var(--color-panel);color:var(--color-ink);border:1px solid var(--color-line);font:12px/1.5 var(--font-body)}
    .out{margin-top:16px;white-space:pre-wrap;border:1px solid var(--color-line);padding:14px}
  </style>
</head>
<body>
  <div class="wrap">
    <p style="letter-spacing:.2em;text-transform:uppercase;font-size:11px"><a href="./index.html">GoldTrac</a></p>
    <h1 class="wordmark">Verify</h1>
    <p>Paste a receipt. Shape, alg, app, hash width. Browser does not yet verify ML-DSA-65.</p>
    <textarea id="raw" placeholder='{"kid":"...","alg":"ML-DSA-65",...}'></textarea>
    <p style="margin:14px 0"><button class="btn" type="button" id="go">Check</button></p>
    <div class="out" id="out">waiting</div>
  </div>
  <script>
    const FIELDS=["kid","alg","payload_hash","chain_root","smt_root","sig","tsa","tsa_time","app"];
    const APPS=["prestige-mcp","deadlinesf","billrosetta","bopcart"];
    const HEX=/^[a-f0-9]{64}$/;
    document.getElementById("go").onclick=()=>{
      const out=document.getElementById("out");
      let rec; try{rec=JSON.parse(document.getElementById("raw").value)}catch(e){out.textContent="invalid JSON\n"+e;return;}
      const lines=[]; let ok=true;
      const missing=FIELDS.filter(k=>!(k in rec));
      if(missing.length){ok=false;lines.push("missing "+missing.join(", "));} else lines.push("nine fields");
      if(rec.alg!=="ML-DSA-65"){ok=false;lines.push("alg must be ML-DSA-65");} else lines.push("alg ML-DSA-65");
      if(!APPS.includes(rec.app)){ok=false;lines.push("app not in the four");} else lines.push("app "+rec.app);
      ["payload_hash","chain_root","smt_root"].forEach(h=>{if(!HEX.test(rec[h]||"")){ok=false;lines.push(h+" not 64 hex");}else lines.push(h+" shape ok");});
      lines.push("FIPS 140-3 module: not claimed");
      out.textContent=(ok?"PASS (schema)\n":"FAIL\n")+lines.join("\n");
    };
  </script>
</body>
</html>
